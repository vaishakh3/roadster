<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111b20" />
    <title>Roadster / Coastal study</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111b20;
        color: #f0eee2;
        font-family: Arial, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        min-height: 62px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 24px;
        gap: 16px;
        border-bottom: 1px solid #415158;
      }
      h1 {
        font-size: 15px;
        letter-spacing: 0.18em;
        font-weight: 800;
        margin: 0;
      }
      h1 span {
        color: #a9c7cc;
        font-size: 10px;
        display: block;
        margin-top: 6px;
        letter-spacing: 0.1em;
        font-weight: 400;
      }
      nav {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      button,
      a {
        font:
          600 12px Arial,
          sans-serif;
        letter-spacing: 0.04em;
        color: inherit;
        text-decoration: none;
        background: none;
        border: 0;
        cursor: pointer;
        padding: 10px 0;
        border-bottom: 2px solid transparent;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid #a3eddb;
        outline-offset: 4px;
      }
      button[aria-pressed="true"] {
        border-color: #a3eddb;
        color: #a3eddb;
      }
      button:disabled {
        opacity: 0.4;
        cursor: wait;
      }
      #drive {
        color: #111b20;
        background: #a3eddb;
        padding: 12px 16px;
        border: 0;
      }
      #game {
        width: 100%;
        flex: 1;
        min-height: 0;
        border: 0;
        background: #111b20;
      }
      footer {
        min-height: 45px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 4px 24px;
        border-top: 1px solid #415158;
        font-size: 11px;
        color: #afc0c4;
      }
      footer nav {
        gap: 16px;
      }
      #status {
        margin: 0;
        line-height: 1.4;
      }
      #retry {
        display: none;
        color: #a3eddb;
      }
      @media (max-width: 760px) {
        header {
          min-height: 46px;
          padding: 7px 12px;
          gap: 8px;
        }
        h1 {
          font-size: 11px;
          letter-spacing: 0.08em;
        }
        h1 span {
          font-size: 9px;
          margin-top: 3px;
        }
        nav {
          gap: 10px;
        }
        button,
        a {
          font-size: 10px;
        }
        #drive {
          padding: 9px 10px;
        }
        footer {
          min-height: 38px;
          padding: 2px 12px;
          gap: 8px;
        }
        footer nav {
          gap: 10px;
        }
        #status {
          font-size: 10px;
          max-width: 38%;
        }
      }
      @media (max-width: 480px) and (orientation: portrait) {
        header {
          flex-wrap: wrap;
        }
        header nav {
          width: 100%;
          justify-content: space-between;
        }
        footer {
          flex-wrap: wrap;
          padding: 8px 12px;
        }
        #status {
          max-width: 100%;
          width: 100%;
        }
        footer nav {
          width: 100%;
          justify-content: space-between;
        }
      }
      #rotate-study {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        background: #111b20;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 32px;
        text-align: center;
        gap: 18px;
      }
      #rotate-study svg {
        width: 90px;
        height: 90px;
        stroke: #a3eddb;
        fill: none;
        stroke-width: 2;
      }
      #rotate-study h2 {
        font-size: 22px;
        letter-spacing: 0.08em;
        margin: 0;
      }
      #rotate-study p {
        font-size: 14px;
        color: #afc0c4;
        line-height: 1.5;
        margin: 0;
      }
      @media (max-width: 900px) and (orientation: portrait) {
        #rotate-study {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <aside id="rotate-study" role="status">
      <svg viewBox="0 0 90 90" aria-hidden="true">
        <rect
          x="28"
          y="13"
          width="34"
          height="64"
          rx="5"
          transform="rotate(40 45 45)"
        />
        <path
          d="M10 34a36 36 0 0 1 52-23M57 5l7 6-8 6M80 56a36 36 0 0 1-52 23M33 85l-7-6 8-6"
        />
      </svg>
      <h2>ROTATE YOUR PHONE</h2>
      <p>
        The coastal study is designed for landscape.<br />Turn your phone
        sideways to explore.
      </p>
    </aside>
    <header>
      <h1>
        ROADSTER / COASTAL STUDY<span
          >BREAKWATER · 500 METRES · EXPERIMENTAL BRANCH</span
        >
      </h1>
      <nav aria-label="Study controls">
        <button id="quality" disabled>DETAIL / AUTO</button>
        <a href="./">FULL GAME ↗</a>
        <button id="drive" disabled>DRIVE THIS SECTION →</button>
      </nav>
    </header>
    <iframe
      id="game"
      title="Playable coastal scenery prototype"
      src="./?qa=1&coastal-study=1"
      allow="fullscreen; gamepad"
      allowfullscreen
    ></iframe>
    <footer>
      <p id="status" role="status">Preparing the coastal study…</p>
      <button id="retry">RETRY</button>
      <nav aria-label="Camera views">
        <button data-view="approach" disabled>APPROACH</button>
        <button data-view="headland" aria-pressed="true" disabled>
          HEADLAND
        </button>
        <button data-view="air" disabled>FLYOVER</button>
        <button data-view="car" disabled>ROADSTER</button>
      </nav>
    </footer>
    <script type="module">
      const frame = document.getElementById("game"),
        status = document.getElementById("status");
      let g,
        driving = false,
        currentView = "headland",
        detail = "auto";
      const controls = [...document.querySelectorAll("button:not(#retry)")];
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const showRecovery = () => {
        status.textContent =
          "Still loading? Open FULL GAME to sign in if prompted, then return and retry.";
        document.getElementById("retry").style.display = "block";
      };
      // An SSO redirect may never fire the iframe's load event. Keep recovery
      // available even when the browser cannot finish that navigation in-frame.
      const loadWatchdog = setTimeout(() => {
        if (!g) showRecovery();
      }, 25000);
      const overlays = (hidden) => {
        for (const id of ["app", "shade", "boost-fx"])
          frame.contentDocument.getElementById(id).style.display = hidden
            ? "none"
            : "";
      };
      function view(name) {
        if (!g) return;
        driving = false;
        currentView = name;
        g.clear();
        g.freeze();
        if (name === "car") g.home();
        else if (g.phase !== "playing") g.start();
        const d = name === "approach" ? 815 : name === "car" ? 1105 : 1080,
          y = name === "air" ? 12 : 0;
        g.setState({
          d,
          x: 0,
          y,
          vy: 0,
          speed: 60,
          time: 25,
          airborne: y > 0,
          lifting: y > 0,
          boosting: false,
          flight: null,
          pitch: 0,
          roll: 0,
        });
        g.step(0);
        overlays(true);
        document
          .querySelectorAll("[data-view]")
          .forEach((b) =>
            b.setAttribute("aria-pressed", String(b.dataset.view === name)),
          );
        document.getElementById("drive").textContent = "DRIVE THIS SECTION →";
        status.textContent =
          name === "car"
            ? "The Roadster, in the new coastal setting."
            : name === "air"
              ? "Flyover · scenery remains three-dimensional."
              : "A coastal cutting, weathered road and open Atlantic.";
      }
      async function ready() {
        const until = performance.now() + 25000;
        while (!frame.contentWindow.__breakwater) {
          if (performance.now() > until)
            throw new Error("The scene is taking longer than expected.");
          await wait(50);
        }
        g = frame.contentWindow.__breakwater;
        g.freeze();
        g.home();
        await g.selectCourse("breakwater");
        g.coached = true;
        clearTimeout(loadWatchdog);
        document.getElementById("retry").style.display = "none";
        controls.forEach((b) => (b.disabled = false));
        view("headland");
      }
      frame.addEventListener("load", () => ready().catch(showRecovery));
      document.getElementById("retry").onclick = () => location.reload();
      document
        .querySelectorAll("[data-view]")
        .forEach(
          (button) => (button.onclick = () => view(button.dataset.view)),
        );
      document.getElementById("quality").onclick = () => {
        detail =
          detail === "auto" ? "high" : detail === "high" ? "low" : "auto";
        const button = frame.contentDocument.getElementById("quality");
        for (
          let i = 0;
          i < 3 &&
          button.querySelector("b").textContent.toLowerCase() !== detail;
          i++
        )
          button.click();
        document.getElementById("quality").textContent =
          "DETAIL / " + detail.toUpperCase();
        if (!driving) g.step(0);
      };
      document.getElementById("drive").onclick = () => {
        if (driving) {
          view(currentView);
          return;
        }
        g.clear();
        g.start();
        g.coached = true;
        g.setState({
          d: 770,
          x: 0,
          y: 0,
          speed: 55,
          time: 0,
          airborne: false,
          lifting: false,
          flight: null,
          pitch: 0,
          roll: 0,
        });
        g.state.rivals.forEach((r, i) =>
          Object.assign(r, {
            d: 795 + i * 19,
            x: [-4.8, 0, 4.8][i % 3],
            y: 0,
            speed: 48 + i * 3,
          }),
        );
        overlays(false);
        g.freeze(false);
        driving = true;
        document.getElementById("drive").textContent = "END DRIVE";
        status.textContent =
          "← → steer · SHIFT boost · SPACE fly. Records are isolated.";
        frame.contentWindow.focus();
      };
      function monitor() {
        if (driving && g) {
          if (g.state.d >= 1260 || g.state.failed || g.phase === "results") {
            g.clear();
            g.freeze();
            driving = false;
            document.getElementById("drive").textContent = "DRIVE AGAIN →";
            status.textContent = g.state.failed
              ? "Try again, or inspect another view."
              : "Section complete. Try the flyover or a different detail level.";
          }
        }
        requestAnimationFrame(monitor);
      }
      document.addEventListener("visibilitychange", () => {
        if (document.hidden && g) g.clear();
      });
      requestAnimationFrame(monitor);
    </script>
  </body>
</html>
