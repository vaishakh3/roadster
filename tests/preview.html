<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Fly Roadster responsive review</title
  ><style>
    body {
      margin: 24px;
      background: #102b34;
      color: #f6f1df;
      font: 13px monospace;
    }
    nav {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    button {
      padding: 12px;
      background: #f6f1df;
      color: #102b34;
      border: 0;
      cursor: pointer;
    }
    iframe {
      border: 0;
      display: block;
      width: 844px;
      height: 390px;
    }
    #status {
      margin: 12px 0;
    }
  </style>
  <nav>
    <button data-size="1280,720">Desktop</button
    ><button data-size="844,390">Landscape phone</button
    ><button data-size="568,320">Small phone</button
    ><button data-size="390,844">Portrait phone</button
    ><button data-size="480,270">Thumbnail size</button
    ><button id="scenery">Scenery only</button
    ><button id="reload">Reload game</button
    ><button id="capture">Clean capture</button>
  </nav>
  <nav>
    <button data-view="impact">Rival impact</button
    ><button data-view="flyover">Fly over rivals</button
    ><button data-view="grid">Starting grid</button
    ><button data-view="home">Start screen</button
    ><button data-view="paint">Paint turn preview</button
    ><button data-view="ghost">Ghost reference</button
    ><button data-view="drive">Drive</button
    ><button data-view="pack">Racing pack</button
    ><button data-view="gap">Bridge approach</button
    ><button data-view="flight">In flight</button
    ><button data-view="results">Results</button
    ><button id="play">Play live</button
    ><button id="tour">Watch full course</button>
  </nav>
  <nav>
    <button data-arena="breakwater">Atlantic</button
    ><button data-arena="redshift">Canyon</button
    ><button data-arena="nightshift">Night port</button
    ><button data-view="tunnel">Low clearance</button
    ><button data-view="last">Final sector</button
    ><button data-view="arch">Landmark</button>
    <button data-view="world">Scenery detail</button>
    <button data-view="ramp">Sky ramp</button
    ><button data-view="flip">Mid flip</button>
    <button data-view="crash">Crash</button
    ><button data-view="trail">Trail turn</button>
    <button data-view="landing">Landing arrest</button
    ><button data-view="contact">On ramp</button
    ><button data-view="gallery">Gallery</button
    ><button data-view="cargo">Cargo</button>
  </nav>
  <p id="status">
    Frozen visual review. Use Play live for native keyboard checks.
  </p>
  <p id="tour-report"></p>
  <iframe title="Game preview" src="../dist/?qa=1"></iframe>
  <script type="module">
    import { driveInput } from "./driver.js";
    import { LAYOUT_VERSION } from "../courses.js";
    const frame = document.querySelector("iframe");
    if (new URLSearchParams(location.search).has("source"))
      frame.src = "../?qa=1";
    document.getElementById("scenery").onclick = () => {
      const w = frame.contentWindow,
        g = w.__breakwater;
      g.start();
      g.freeze();
      g.setState({
        d:
          g.course.id === "redshift"
            ? 540
            : g.course.id === "nightshift"
              ? 240
              : 240,
        x: 0,
        speed: 60,
      });
      g.step(0);
      for (const id of ["app", "shade", "boost-fx"])
        w.document.getElementById(id).style.display = "none";
    };
    document.getElementById("capture").onclick = () => {
      document.body.style.margin = "0";
      document
        .querySelectorAll("nav,p")
        .forEach((el) => (el.style.display = "none"));
      const g = frame.contentWindow.__breakwater;
      if (g.phase === "paused") g.resume();
      g.step(0);
    };
    document.querySelectorAll("[data-size]").forEach(
      (b) =>
        (b.onclick = () => {
          const [w, h] = b.dataset.size.split(",");
          frame.style.width = w + "px";
          frame.style.height = h + "px";
        }),
    );
    document.querySelector("#reload").onclick = () =>
      frame.contentWindow.location.reload();
    document.querySelectorAll("[data-arena]").forEach(
      (b) =>
        (b.onclick = async () => {
          const g = frame.contentWindow.__breakwater;
          if (!g) return;
          g.home();
          await g.selectCourse(b.dataset.arena);
          g.freeze();
          g.step(0);
        }),
    );
    document.querySelectorAll("[data-view]").forEach(
      (b) =>
        (b.onclick = () => {
          const g = frame.contentWindow.__breakwater;
          if (!g) return;
          g.freeze();
          if (b.dataset.view === "home") {
            g.home();
            g.step(0);
            return;
          }
          if (b.dataset.view === "paint") {
            g.records[g.course.id] = {
              layout: LAYOUT_VERSION,
              medal: 1,
              time: 100,
              score: 1000,
            };
            g.home();
            frame.contentDocument.getElementById("paint").click();
            for (let i = 0; i < 65; i++) g.step(1 / 30);
            return;
          }
          g.start();
          const v = b.dataset.view;
          if (v === "ghost") {
            if (!g.ghostAppearance.enabled)
              frame.contentDocument.getElementById("ghost").click();
            g.records[g.course.id] = {
              layout: LAYOUT_VERSION,
              time: 90,
              score: 12500,
              medal: 1,
              ghost: [
                [0, 380, 1, 0],
                [10, 880, 1, 0],
              ],
            };
            g.setState({ d: 410, x: -2, time: 1, speed: 60 });
          }
          if (v === "grid") g.setState({});
          if (v === "world")
            g.setState({
              d:
                g.course.id === "breakwater"
                  ? 1000
                  : g.course.id === "redshift"
                    ? 1280
                    : 2240,
              x: 0,
              time: 25,
              speed: 60,
            });
          if (v === "impact" || v === "flyover") {
            g.setState({
              d: 100,
              x: 0,
              y: v === "flyover" ? 4.5 : 0,
              speed: 76,
              airborne: v === "flyover",
              vy: 0,
            });
            Object.assign(g.state.rivals[0], {
              d: 106,
              x: 0,
              y: 0,
              speed: 30,
              vx: 0,
            });
            g.state.rivals[1].d = 125;
            g.state.rivals[2].d = 130;
            for (let i = 0; i < (v === "flyover" ? 12 : 8); i++) g.step(1 / 60);
          }
          if (v === "pack") {
            const w = frame.contentWindow;
            g.setState({});
            for (let i = 0; i < 300; i++) {
              const input = driveInput(g.state);
              for (const [code, on] of [
                ["ArrowLeft", input.steer < -0.04],
                ["ArrowRight", input.steer > 0.04],
                ["Space", input.fly],
                ["ArrowDown", input.brake],
              ])
                w.dispatchEvent(
                  new w.KeyboardEvent(on ? "keydown" : "keyup", {
                    code,
                    bubbles: true,
                    cancelable: true,
                  }),
                );
              g.step(1 / 60);
            }
            g.clear();
          }
          if (v === "drive")
            g.setState({
              d: 380,
              x: 2.5,
              speed: 60,
              time: 6,
              score: 250,
              gates: 1,
            });
          if (v === "gap")
            g.setState({
              d: g.course.gaps[0].start - 80,
              x: 0,
              speed: 60,
              time: 10,
              score: 500,
              gates: 2,
            });
          if (v === "flight")
            g.setState({
              d: g.course.gaps[0].start + 20,
              x: 0,
              y: 5.7,
              vy: 1,
              speed: 70,
              time: 12,
              score: 750,
              gates: 2,
              airborne: true,
              lifting: true,
              boosting: true,
            });
          if (v === "arch")
            g.setState({
              d: 550,
              x: -1,
              y: 0,
              time: 9,
              speed: 70,
              boosting: true,
            });
          if (v === "tunnel")
            g.setState({
              d: (g.course.tunnels[0]?.start || 1200) - 50,
              time: 18,
              speed: 65,
            });
          if (v === "ramp")
            g.setState({
              d: g.course.ramps[1].d - g.course.ramps[1].length - 40,
              speed: 70,
              time: 20,
            });
          if (v === "gallery")
            g.setState({
              d: g.course.id === "redshift" ? 1040 : 180,
              speed: 65,
              time: 7,
            });
          if (v === "cargo") g.setState({ d: 1760, speed: 65, time: 26 });
          if (v === "flip") {
            const r = g.course.ramps[1];
            g.setState({ d: r.d - 0.1, y: r.height, speed: 70, time: 20 });
            g.step(0.01);
            for (let i = 0; i < 12; i++) g.step(0.05);
          }
          if (v === "landing") {
            const r = g.course.ramps[1];
            g.setState({ d: r.d - 0.1, y: r.height, speed: 70, time: 20 });
            g.step(0.01);
            while (g.state.d < r.land - 15 && g.state.flight) g.step(1 / 60);
          }
          if (v === "contact") {
            const r = g.course.ramps[1];
            g.setState({ d: r.d - r.length - 5, speed: 65, time: 20 });
            while (g.state.d < r.d - r.length * 0.3) g.step(1 / 60);
          }
          if (v === "crash") {
            const o = g.course.obstacles[0];
            g.setState({ d: o.d - 3, x: o.x, speed: 76, hull: 1 });
            for (let i = 0; i < 11; i++) g.step(0.05);
          }
          if (v === "trail") {
            const w = frame.contentWindow;
            g.setState({ d: 380, speed: 76 });
            for (const code of ["ShiftLeft", "ArrowRight"])
              w.dispatchEvent(
                new w.KeyboardEvent("keydown", {
                  code,
                  bubbles: true,
                  cancelable: true,
                }),
              );
            for (let i = 0; i < 20; i++) g.step(1 / 60);
            w.dispatchEvent(
              new w.KeyboardEvent("keyup", {
                code: "ArrowRight",
                bubbles: true,
              }),
            );
            w.dispatchEvent(
              new w.KeyboardEvent("keydown", {
                code: "ArrowLeft",
                bubbles: true,
                cancelable: true,
              }),
            );
            for (let i = 0; i < 15; i++) g.step(1 / 60);
            for (const code of ["ShiftLeft", "ArrowLeft"])
              w.dispatchEvent(
                new w.KeyboardEvent("keyup", { code, bubbles: true }),
              );
          }
          if (v === "last")
            g.setState({ d: g.course.length - 300, time: 48, speed: 70 });
          if (v === "results") {
            g.setState({
              d: g.course.length - 1,
              time: 59,
              gates: 16,
              score: 18600,
            });
            g.step(0.1);
          }
          g.step(0);
        }),
    );
    document.querySelector("#play").onclick = () => {
      const g = frame.contentWindow.__breakwater;
      g.start();
      g.freeze(false);
    };
    document.getElementById("tour").onclick = () => {
      const w = frame.contentWindow,
        g = w.__breakwater;
      g.start();
      g.freeze(false);
      const held = new Set();
      let frames = 0,
        started = performance.now();
      const send = (code, on) => {
        if (held.has(code) === on) return;
        on ? held.add(code) : held.delete(code);
        w.dispatchEvent(
          new w.KeyboardEvent(on ? "keydown" : "keyup", {
            code,
            bubbles: true,
            cancelable: true,
          }),
        );
      };
      const drive = () => {
        const s = g.state;
        if (g.phase !== "playing") {
          for (const code of [...held]) send(code, false);
          document.getElementById("tour-report").textContent =
            `COURSE ${s.finished ? "COMPLETE" : "STOPPED"} · ${s.time.toFixed(2)} s · ${s.gates}/${s.course.gates.length} gates · hull ${s.hull}/3 · ${s.score} pts · ${Math.round(frames / ((performance.now() - started) / 1000))} browser frames/sec average`;
          return;
        }
        const input = driveInput(s);
        send("ArrowRight", input.steer > 0.25);
        send("ArrowLeft", input.steer < -0.25);
        send("Space", input.fly);
        send("ShiftLeft", input.boost);
        send("ArrowDown", input.brake);
        frames++;
        requestAnimationFrame(drive);
      };
      requestAnimationFrame(drive);
    };
    frame.onload = () => {
      const timer = setInterval(() => {
        const g = frame.contentWindow.__breakwater;
        if (g) {
          if (g.phase === "home") g.freeze();
          clearInterval(timer);
        }
      }, 50);
    };
    setInterval(() => {
      const g = frame.contentWindow.__breakwater;
      if (g)
        document.querySelector("#status").textContent =
          `${g.phase} · X ${g.state.x.toFixed(2)} · Y ${g.state.y.toFixed(2)} · Speed ${(g.state.speed * 3.6).toFixed(0)} · draws ${g.drawCalls} · tris ${g.triangles} · DPR ${g.pixelRatio} · steer ${g.input.steer} · boost ${g.input.boost} · fly ${g.input.fly}`;
    }, 100);
  </script>
</html>
